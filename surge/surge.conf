DOMAIN-SUFFIX,weather.apple.com,CN
DOMAIN-SUFFIX,weather-analytics-events.apple.com,CN
# APNs 域名置于 AppleCN 之前，避免规则集将其直连。
DOMAIN,identity.apple.com,场景分流
DOMAIN-SUFFIX,push.apple.com,场景分流
DOMAIN-SUFFIX,push-apple.com.akadns.net,场景分流
RULE-SET,https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/AppleCN.list,CN
