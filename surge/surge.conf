RULE-SET,https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/WeChat.list,CN
RULE-SET,https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Bilibili.list,CN
