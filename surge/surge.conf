# ══════════════════════════════════════════
# 3.协议级拦截
# ══════════════════════════════════════════
# STUN 放在私有网络之后：局域网内的 STUN 交给 DIRECT，其余一律回失败，让 WebRTC 尽快回落 TURN，
# 减少真实 IP 暴露（与 Egern / Loon 的 STUN 处理对齐）。用 REJECT 而非 REJECT-NO-DROP：
# WebRTC 需要快速失败才能及时回落。不需要可整条注释掉；FaceTime / 语音会议异常时先注释它。
PROTOCOL,STUN,REJECT
# QUIC 不在规则里拦：改用 [General] block-quic = all，全局拦截 UDP/443。

# ══════════════════════════════════════════
# 4.Tailscale 子网路由（重排后移到它该在的位置）
# ══════════════════════════════════════════
# tailnet 里已有设备批准广播 192.168.1.0/24，这组规则把这一个网段交给 Tailscale 策略。
# 位置很关键：上面第 2 段已有 IP-CIDR,192.168.0.0/16,DIRECT,no-resolve，规则自上而下求值，
# 放到它后面就永远命中不了（流量会被判为 DIRECT）。
# 只写 /24、不写整条 192.168.0.0/16：自家路由（YUQI 那台）的 192.168.77.x 仍直连，
# 关掉 Tailscale 时也只有这一个网段受影响。
# 与出口节点（exit-node）/ MagicDNS 无关，后两者由策略自己下发路由，不需要写规则。
IP-CIDR,192.168.1.0/24,Tailscale,no-resolve

