# Proxy-Config / Surge 本地配置（关联配置的本地那一份）
#
# 用法：
#   - 先把 surge.conf 导入 Surge 并切换过去，再在 Surge 里对本配置点「创建关联配置」，
#     弹窗里只勾选 Proxy Group，其余段全部不勾；Surge 会生成指向本文件的 #!include。
#   - 或者直接从安装页一键导入本文件（install.html 顶部的 local.conf 按钮），存进 Profiles 目录后
#     把 surge.conf 里那句 #!include 的相对路径改成实际文件名。
#   - 本文件存放订阅 URL 与 MITM 证书。以后 surge.conf 怎么更新，这两样都不会被覆盖。
#   - Tailscale 不在本文件：它的策略行与 [Tailscale tailscale] 段直接写在 surge.conf 里
#     （那条策略改了会跟着上游一起更新）。登录状态存在本机，更新配置后不用重新登录。
#   - 不要把真实订阅 URL、auth key 提交到仓库。
#
# 注意：
#   - 本文件是「只含部分段的配置」，内容必须带段头。引用的文件不能再引第三个文件（官方限制）。
#   - 一个段只引用一个文件时该段可在 UI 里正常编辑；引用托管配置的段是只读的。
#   - 段名不要与本文件里已有的重复，否则加载失败。

[Proxy Group]
# > 机场订阅：隐藏的订阅入口。把下面的占位串换成你的机场订阅 URL（本文件唯一必改的一处）。
#   Proxy / Auto 通过 include-other-group 复用；policy-regex-filter 与其余端同一套，用来剔除机场信息节点。
机场订阅 = select, policy-path=这里填入你的机场订阅 URL, update-interval=86400, policy-regex-filter=(?i)^(?!.*(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$, hidden=true

[MITM]
# > CA 证书（只存在 profile 与系统钥匙串，重新下载配置会整份覆盖，所以放这里最稳）。
#   取法：如果之前那份配置里有 ca-p12 / ca-passphrase，整行复制过来；没有就在
#   Surge 的 [更多] → [MITM] 里点「生成证书」，它会把 CA 写进当前 profile，再去抄一次。
#   下面两行默认注释掉：空 base64 会让 profile 校验报错，填好真值再取消注释。
#ca-p12 = MIIJtQ..........
#ca-passphrase = 你的口令

# > hostname（解密哪些域名）默认不写：本仓库用模块下发 hostname，模块可以改 hostname
#   但不能改 CA，两者不冲突。只有想本地强制覆盖解密范围时，才取消下面这行的注释。
#   注意：写了它会整体替换生效列表，模块给的值不再追加。
#hostname = -*.apple.com, -*.icloud.com, -*.mzstatic.com, *
