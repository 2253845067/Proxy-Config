# Proxy-Config / Surge 本地主配置
#
# 先通过 URL 将远程 surge.conf 导入 Surge，再创建本地配置并保存本文件内容。
# 本地配置按段引用 Surge 中名为 surge.conf 的配置，订阅地址与 MITM 证书保存在本文件。
# 若 Surge 中核心配置显示为其他文件名，请将下面的 include 目标改成该名称。
#
# 若 GitHub raw 无法访问，可将下面 URL 中的地址替换为 gh-proxy 镜像地址。

[General]
#!include surge.conf

[SSID Setting]
#!include surge.conf

[Host]
#!include surge.conf

[Proxy]
#!include surge.conf

[Tailscale tailscale]
#!include surge.conf

[Proxy Group]
# 本地订阅组：将占位串替换为真实订阅 URL，不要提交到仓库。
机场订阅 = select, policy-path=这里填入你的机场订阅 URL, update-interval=86400, policy-regex-filter=(?i)^(?!.*(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$, hidden=true
#!include surge.conf

[Rule]
#!include surge.conf

[MITM]
# 在本地生成并填写证书，保留为注释直到有真实值。
#ca-p12 = 你的证书 Base64
#ca-passphrase = 你的证书口令
# 可选 hostname 覆盖会整体替换模块下发的 hostname 列表。
#hostname = -*.apple.com, -*.icloud.com, -*.mzstatic.com, *
