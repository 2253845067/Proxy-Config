# =======================================================
# 7. 分流规则 Rules
# =======================================================

rules:
  # ══════════════════════════════════════════
  # 1.REJECT
  # ══════════════════════════════════════════
  - RULE-SET,BanAD,REJECT-DROP                                       # 广告拦截
  - RULE-SET,BanEasyList,REJECT-DROP                                 # 广告拦截
  - RULE-SET,BanEasyListChina,REJECT-DROP                            # 广告拦截
  - RULE-SET,BanEasyPrivacy,REJECT-DROP                              # 广告拦截
  - RULE-SET,BanProgramAD,REJECT-DROP                                # 应用净化

  # ══════════════════════════════════════════
  # 2.DIRECT / 私有网络
  # ══════════════════════════════════════════
  - RULE-SET,LocalAreaNetwork,DIRECT                                 # 局域网 / 私有网络
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve                             # RFC1918 A 类私网
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve                          # 运营商级 NAT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve                            # 本机回环
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve                         # 链路本地
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve                          # RFC1918 B 类私网
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve                         # RFC1918 C 类私网
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve                            # 组播（mDNS/SSDP 等本地发现）

  # ══════════════════════════════════════════
  # 3.QUIC 拦截
  # ══════════════════════════════════════════
  # 拒绝 UDP/443，让浏览器回落到 TCP/443：QUIC 走 UDP，很多节点不支持 UDP 转发，
  # 放行会让这部分流量绕过代理直接暴露，或在节点上超时。不需要可整条注释掉。
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

