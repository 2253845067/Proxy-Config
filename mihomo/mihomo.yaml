# Proxy-Config / Mihomo 模板
#
# 用途：
#   - 作为 Sub-Store 前端 [文件] tab 中的 Mihomo 配置文件远程模板使用。
#   - 在 Sub-Store 里配置订阅与脚本操作后，将生成链接导入 Mihomo Party 等客户端。
#   - 不在这里手写 proxy-providers 或 proxies；Sub-Store 会在输出结果中注入节点。
#
# 策略组：
#   - 精简分组：Proxy / Auto / CN。
#   - Proxy 和 Auto 通过 include-all + filter 自动收纳订阅节点。
#   - 不再为 OpenAI、YouTube、Steam 等服务单独建组，避免面板过长。
#
# 规则：
#   - 广告规则走 REJECT-DROP。
#   - 国内、局域网、常见中国服务走 DIRECT/CN。
#   - 海外服务走 Proxy；未命中流量兜底走 Proxy。
#
# DNS / 泄漏防护（本次加固）：
#   - fake-ip 过滤改为 rule 模式，只有明确 real-ip 的域名才下发真实 IP。
#   - 关闭配置 hosts 与系统 hosts，本机 hosts 不再能改变解析结果。
#   - 海外 nameserver 全部为 IP 直连 DoH，并经 Proxy 出境，不依赖明文 bootstrap。
#   - direct-nameserver 使用国内 DoH，直连流量也不回落到明文 DNS。
#   - 核心规则集改用 mrs 二进制格式（需 mihomo 1.18+），启动更快、内存更省。
#   - 拒绝 UDP/443（QUIC），避免 QUIC 绕过代理与 UDP 泄漏。


# 1. 全局参数 Global Settings
# =======================================================

# ── 系统设置 ──
mixed-port: 7890                             # 混合代理端口
allow-lan: true                              # 允许局域网连接
bind-address: "*"                            # 绑定所有网卡 IP，确保本机所有内网 IP 都能接收局域网请求
ipv6: false                                  # 关闭 IPv6 解析
log-level: warning                           # 日志级别 仅记录警告和错误，保持后台清爽并节省硬盘

# ── 分流与防封锁机制 ──
# find-process-mode: "off"                   # 进程匹配模式: off 关闭进程规则/ strict 按需精准匹配/ always 强制查询耗性能
# global-client-fingerprint: chrome          # 全局 TLS 指纹伪装: 伪装为正常浏览器，降低节点被墙概率 可选 chrome/ios/random 等

# ── 性能与连接优化 ──
unified-delay: true                          # 统一延迟计算方式
tcp-concurrent: true                         # 开启 TCP 并发连接，大幅加快多图网页加载速度
keep-alive-idle: 600                         # TCP 空闲 600 秒后启动保活探针
keep-alive-interval: 15                      # 保活心跳包发送间隔 15 秒

# ── GEO 数据库 ──
geo-auto-update: true                        # 自动更新 GeoIP/GeoSite 数据库，避免 GEOIP 规则因数据过期误判
geo-update-interval: 24                      # 更新间隔（小时）；不需要可整段删除

# ── 运行状态持久化 ──
profile:                                     # 记忆功能
  store-selected: true                       # 记忆手动选择的节点
  store-fake-ip: true                        # 记忆 Fake-IP 映射表

# ── Clash api ──                            # 默认注释 Nikki可取消注释使用  win mac等桌面gui客户端保持注释避免冲突
#external-controller: 0.0.0.0:9095
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# =======================================================
# 2. 流量嗅探 Sniffer
# =======================================================

# ── Sniffer ──
sniffer:
  enable: true                               # 核心开关 开启流量嗅探
  parse-pure-ip: false                       # 纯 IP 连接不再嗅探，只处理本身带域名的连接，省一次拆包
  override-destination: false                # 全局默认不改写目标，避免嗅探结果覆盖真实目的地址
  sniff:
    HTTP:
      ports: [80, 8080-8880]                 # 嗅探 HTTP 协议的标准端口及常见的非标大端口
      override-destination: true             # 局部覆盖 强制用嗅探到的真实域名替换 HTTP 请求中的假 IP
    TLS:
      ports: [443, 8443]                     # 嗅探 HTTPS/TLS 加密流量，通过读取握手包中的 SNI 获取真实域名
    QUIC:
      ports: [443]                           # 嗅探 QUIC HTTP/3 协议流量
  skip-domain:                               # 嗅探豁免名 遇到以下域名直接放行不拆包，防止破坏特殊协议导致断连
    - "*.lan"                                # 局域网 / 私有网络：必须返回真实 IP，否则本地服务无法访问
    - "*.local"
    - "Mijia Cloud"                          # 米家等本地发现协议
    - "dlg.io.mi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "ntp.*.com.cn"

# =======================================================
# 3. 虚拟网卡 TUN
# =======================================================

tun:
  enable: true                               # 开启 TUN 虚拟网卡
  stack: mips                                # mihomo 自研协议栈：默认推荐，开销低且无需放行防火墙（旧内核不支持时改回 mixed）
  dns-hijack: ["any:53", "tcp://any:53"]     # 分别劫持 UDP/TCP DNS，彻底防止系统 DNS 绕过
  #device: nikki                             #使用nikki，混入全部不修改的情况，开启接口指定为nikki

  # 由内核接管路由：只有 TUN 真正跑起来，DNS 劫持与分流才成立
  auto-route: true                           # 自动接管系统路由，避免应用绕过 TUN 直连 DNS
  auto-redirect: false                       # 桌面 GUI 由 TUN 路由接管，不启用 Linux 专用重定向
  auto-detect-interface: true                # 自动识别真实网络出口
  strict-route: true                         # 严格路由，阻止 IPv4/IPv6 流量绕过 TUN

# =======================================================
# 4. DNS
# =======================================================

dns:
  # ── 运行参数 ──
  enable: true                               # 开启内置 DNS 服务
  cache-algorithm: arc                       # DNS 缓存淘汰算法 ARC 相比传统 LRU 命中率更高
  listen: 0.0.0.0:53                         # 标准 DNS 端口，便于系统 DNS 接管；若 53 被占用（Windows 常见于 ICS/Docker）改回 0.0.0.0:1053
  ipv6: false                                # 关闭 IPv6 解析 保持与全局设置一致
  respect-rules: true                        # DNS 请求遵循分流规则，由规则决定 DNS 查询走向而非固定出口
  prefer-h3: false                           # 与 respect-rules 同时开启容易互相干扰，官方也建议关闭
  use-hosts: false                           # 不读取本配置里的 hosts，避免静态映射把域名带偏
  use-system-hosts: false                    # 不读取系统 hosts，本机 hosts 不再能让域名解析绕过代理

  # ── 基础 DNS ──
  default-nameserver:                        # 引导 DNS 仅用于解析 DNS 服务器自身的域名，必须是 IP
    - 223.5.5.5
    - 223.6.6.6

  proxy-server-nameserver:                   # 节点专线 专职解析节点与订阅域名，不经代理，避免先有鸡还是先有蛋
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:                         # 直连兜底 走 DIRECT 的域名用它解析，同样是加密查询
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false     # 直连 DNS 不受 nameserver-policy 影响，避免两套策略互相覆盖

  nameserver:                                # 国外兜底 未命中的域名走海外 DoH 并强制从 Proxy 出境
    - https://1.1.1.1/dns-query#Proxy
    - https://8.8.8.8/dns-query#Proxy

  # ── DNS 分流 ──
  nameserver-policy:
    "rule-set:LocalAreaNetwork": [system]                                      # 内网域名交给系统 DNS，路由器/本机域名才能解析
    "rule-set:UnBan": [https://223.5.5.5/dns-query, https://doh.pub/dns-query]  # 连通性检测
    "rule-set:NetEaseMusic": [https://223.5.5.5/dns-query, https://doh.pub/dns-query]   # 网易云音乐
    "rule-set:ChinaMedia": [https://223.5.5.5/dns-query, https://doh.pub/dns-query]     # 国内媒体
    "rule-set:ChinaDomain": [https://223.5.5.5/dns-query, https://doh.pub/dns-query]    # 中国域名

  # ── Fake-IP ──
  enhanced-mode: fake-ip                     # 开启 Fake-IP 增强模式 秒回假 IP，极大提升网络响应速度
  fake-ip-range: 198.18.0.1/16               # IANA 保留给 网络基准测试用的段（RFC 2544/6815），明确不会公网路由，安全可靠
  fake-ip-filter-mode: rule                  # 规则模式：自上而下匹配，命中 real-ip 才返回真实 IP，其余一律 fake-ip
  fake-ip-filter:
    - DOMAIN-SUFFIX,lan,real-ip              # 局域网 / 私有网络：必须返回真实 IP，否则本地服务无法访问
    - DOMAIN-SUFFIX,local,real-ip
    - DOMAIN-SUFFIX,arpa,real-ip
    - DOMAIN-SUFFIX,ntp.org,real-ip          # 时间同步：假 IP 会让 NTP 校验失败
    - RULE-SET,LocalAreaNetwork,real-ip
    - RULE-SET,UnBan,real-ip                 # 连通性探测：返回假 IP 会导致 Windows/macOS 报断网
    - RULE-SET,Apple,real-ip                 # Apple 服务
    - RULE-SET,NetEaseMusic,real-ip          # 网易云音乐
    - RULE-SET,ChinaMedia,real-ip            # 国内媒体
    - RULE-SET,ChinaDomain,real-ip           # 中国域名
    - MATCH,fake-ip                          # 其余全部下发 fake-ip

# =======================================================
# 5. 策略组 Proxy Groups
# =======================================================

# ── 策略组 ──
proxy-groups:

  # ── Proxy ──
  - {name: Proxy,       type: select, proxies: [Auto], include-all: true, filter: &FilterAll '(?i)^(?!.*(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$', icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png"}  # 全部节点手动选择

  # ── Auto ──
  - {name: Auto,        type: url-test, include-all: true, filter: *FilterAll, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 50, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png"}  # 自动选择低延迟节点

  # ── CN ──
  - {name: CN,          type: select, proxies: [DIRECT, Proxy, REJECT], icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png"}  # 默认国内直连

