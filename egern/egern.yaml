# 证书由 Egern 管理；公开仓库中不要填写证书或口令。
mitm:
  ca_p12:
  ca_passphrase:

# 模块说明、分组排障、MITM 风险与误伤域名见 README；模块自带规则优先级高于 rules。
modules:
  # ── 基础设施 ──
  - name: Script-Hub
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/modules/script-hub.surge.sgmodule"
    enabled: true

