      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/DownloadCDN_Global.yaml"
      policy: Proxy
      update_interval: 86400
  - rule_set:
      name: AppleServers
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/AppleServers.yaml"
      policy: Proxy
      update_interval: 86400
  - rule_set:
      name: ProxyAll
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Proxy.yaml"
      policy: Proxy
      update_interval: 86400

  # ── 兜底 ──
  - geoip:
      match: CN                         # 已解析出 IP 且归属中国 -> CN
      policy: CN
      no_resolve: true                  # 只判断已有 IP 的连接，不为域名额外发起解析
  - default:
      policy: 场景                      # 前面全没命中 -> 场景（在家直连 / 在外走 Proxy）；删掉场景组时改回 Proxy

# MITM 空段：提前占位，之后加 modules 只改 modules 段，不用同时改两处。
# 现在没有域名列表也没有启用的 modules，因此不会解密任何流量。
# ca_p12 / ca_passphrase 必须留空：本仓库是公开的，证书由 Egern 自己管理。
mitm:
  ca_p12:
  ca_passphrase:

# ══ 模块 / MITM ══
# 共 16 个，全部 enabled: true。排障时按下面的分组整组注释，不要逐个乱试：
#   基础设施 1：Script-Hub —— script.hub 这个假域名靠它在本机转换规则，
#               关掉它，「开屏广告」和「高德去广告」两条（走 script.hub 中转）会一起失效
#   第一波 5：开屏广告、B 站两件套、YouTube 净化、百度去广告
#   第二波 5：百度地图、高德、夸克、夸克扫描王、网易云
#   第三波 4：微信公众号、淘宝、拼多多、京东（京东同时把 Cookie 上报给第三方比价服务）
#   其他 1：missav 网页净化
#
# MITM 域名由各模块自己声明、由客户端自动合并，所以上面的 mitm 段不写 hostname；但绝不能写 "*"。
# 实测这批模块合计声明 31 个 MITM 域名，全部是具体域名，没有通配。
# 证书固定（pinning）的 App（银行、12306、部分政务/游戏）被 MITM 后会直接没有任何网络，
# 出现「某个 App 突然全断」时先禁用对应模块，而不是去改规则。
# 首次启用会要求安装并信任根证书，装好之前所有模块都不生效。
#
# 注意：模块会自带 [Rule] 段并被合并进主规则，优先级高于 rules 段（多为 pre-matching），
# 这是三条最容易造成误伤的，出问题先看这里：
#   拼多多 → REJECT cdl-1/cdl-p2/cd-1.pddpic.com（图片 CDN）→ 商品图可能加载不出来
#   淘宝   → REJECT ut.taobao.com / ossgw.alicdn.com / hudong.alicdn.com（埋点与 CDN）→ 个别图片/互动挂件异常
#   微信   → REJECT SUFFIX wxs.qq.com → 小程序静态资源域，小程序白屏时第一个怀疑它
# 其余注入规则都是纯广告/埋点域名（网易云 4 条、京东 1 条 jddebug、拼多多其余 pinduoduo 子域），风险低。
modules:
  # ── 基础设施 ──
  - name: Script-Hub
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/modules/script-hub.surge.sgmodule"
    enabled: true

  # ── 第一波 ──
  - name: 开屏广告
    url: "http://script.hub/file/_start_/https://ddgksf2013.top/rewrite/StartUpAds.conf/_end_/StartUpAds.sgmodule?type=qx-rewrite&n=%E5%A2%A8%E9%B1%BC%E5%8E%BB%E5%BC%80%E5%B1%8F2.0%E5%8E%BB%E5%B9%BF%E5%91%8A%40ddgksf2013+%E5%B7%B2%E6%8A%93%E5%8C%85400%E4%BD%99%E5%BA%94%E7%94%A8%E5%8E%BB%E5%BC%80%E5%B1%8F&headers=User-Agent:surge&del=true&jqEnabled=true&target=surge-module&category=ddgksf2013"
    enabled: true

  - name: B站去广告
    url: "https://gh-proxy.com/https://github.com/BiliUniverse/ADBlock/releases/latest/download/BiliBili.ADBlock.sgmodule"
    compat_arguments:
      Feed.Activity: 'true'
      Feed.Vertical: 'true'
      LogLevel: OFF
    enabled: true

  - name: B站界面增强
    url: "https://gh-proxy.com/https://github.com/Biliverse/Enhanced/releases/latest/download/Biliverse.Enhanced.plugin"
    compat_arguments:
      Home.Switch: 'true'
      Home.Tab_default: '2037'
      Home.Top_left: mine
      Region.Switch: 'true'          # 番剧地区解锁；要纯界面改版就改 false
      Mine.Switch: 'true'
      Mine.iPad.Switch: 'true'
      Storage: PersistentStore
      LogLevel: WARN
    enabled: true

  - name: YouTube净化
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Egern-YouTube.yaml"
    compat_arguments:
      屏蔽Shorts按钮: 'true'
      blockUpload: 'true'
      blockShorts: 'true'
      autoHd: 'true'
      blockGames: 'true'
      blockVerticalLive: 'true'
      jumpAhead: 'true'
      blockStore: 'true'
      nativeDownload: 'true'
    enabled: true

  # 只覆盖 m.baidu.com / www.baidu.com 的搜索首页信息流，不含网盘与贴吧
  - name: 百度网页去广告
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/jadkg/egern/refs/heads/main/百度去广告.Ipx"
    enabled: true

  # ── 第二波 ──
  - name: 百度地图去广告
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/jadkg/egern/refs/heads/main/百度地图.module"
    enabled: true

  - name: 高德去广告
    url: "http://script.hub/file/_start_/https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/AmapAds.conf/_end_/AmapAds.sgmodule?type=qx-rewrite&n=%E9%AB%98%E5%BE%B7%E5%9C%B0%E5%9B%BE%E5%8E%BB%E5%B9%BF%E5%91%8A%40ddgksf2013+%E5%BA%94%E7%94%A8%E5%87%80%E5%8C%96&headers=User-Agent:surge&del=true&jqEnabled=true&target=surge-module&category=ddgksf2013"
    enabled: true

  - name: 夸克去广告
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/QingRex/LoonKissSurge/refs/heads/main/Surge/Beta/夸克去广告.beta.sgmodule"
    enabled: true

  - name: 夸克扫描王去广告
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/QingRex/LoonKissSurge/refs/heads/main/Surge/Beta/夸克扫描王去广告.beta.sgmodule"
    enabled: true

  # PR* 一组开关是作者未公开含义的附加项（B 配置里原样照抄），出现界面异常时先关它们
  - name: 网易云音乐增强
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/ios151/NeteasemusicAd/main/wyy.lpx"
    compat_arguments:
      FX: 'false'
      MY: 'true'
      DT: 'false'
      GZ: 'true'
      SOU: 'true'
      XD: 'true'
      BK: 'true'
      TS: 'true'
      HDTAB: 'false'
      PRGG: 'false'
      PRDRD: 'false'
      PRSCVPT: 'false'
      PRST: 'false'
      HMPR: 'false'
      PRRR: 'true'
      PRRK: 'false'
      PRMST: 'false'
      PRCN: 'true'
      PRPRS: 'true'
      PRRSS: 'true'
      LogLevel: info
    enabled: true

  # ── 第三波 ──
  # 微信公众号只启用这一条：小程序去广告与个人域名的 wechatad 都改同一批接口，
  # 同时开会互相覆盖，且小程序那条最容易把小程序改到白屏。
  - name: 微信公众号去广告
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/QingRex/LoonKissSurge/refs/heads/main/Surge/Beta/微信公众号去广告.beta.sgmodule"
    enabled: true

  - name: 淘宝去广告
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/jadkg/egern/refs/heads/main/淘宝去广告.Ipx"
    enabled: true

  - name: 拼多多去广告
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/QingRex/LoonKissSurge/refs/heads/main/Surge/Beta/拼多多去广告.beta.sgmodule"
    enabled: true

  # Manmanbuy-Cookie: true 会把京东 Cookie 上报给第三方比价服务，是隐私代价而不只是广告问题
