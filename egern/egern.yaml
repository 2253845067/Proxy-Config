      name: WeChat
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/WeChat.yaml"
      policy: CN
      update_interval: 86400
  - rule_set:
      name: Bilibili
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Bilibili.yaml"
      policy: CN
      update_interval: 86400
  # Apple 天气放行直连：AppleServers 里的 17.0.0.0/8 会把天气的 17.x CDN 一起拽去代理，
  # 天气数据 / WeatherKit 已在 AppleCN 里，这里补上 AppleCN 没覆盖的两个
  - domain_suffix:
      match: weather.apple.com
      policy: CN
  - domain_suffix:
      match: weather-analytics-events.apple.com
      policy: CN
  - rule_set:
      name: AppleCN
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/AppleCN.yaml"
      policy: CN
      update_interval: 86400
  - rule_set:
      name: OneDrive
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/OneDrive.yaml"
      policy: CN
      update_interval: 86400
