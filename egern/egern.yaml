# Proxy-Config / Egern 配置
#
# 用途：
#   - 通过 README 里的一键导入链接直接导入 Egern 使用。
#   - 导入后把你的机场订阅 URL 添加到“机场订阅”策略组，其他策略组会自动复用这些节点。
#
# 策略组（5 个）：
#   - 场景：连上透明代理路由器的 WiFi 时整体 DIRECT，其余网络交给 Proxy；SSID 是占位名，导入后必须替换。
#   - Proxy：第一个是 Auto，后面直接列出全部订阅节点，可按节点手动选择。
#   - Auto / CN：自动测速 / 国内直连，命名与 mihomo、Loon 保持一致。
#   - 机场订阅：隐藏的订阅入口；节点只在这里定义，Proxy 通过 YAML 锚点 *SubURL 复用，占位串只改一处。
#   - 不为 OpenAI、YouTube、Steam 等服务单独建组，避免面板过长。
#
# 规则（51 条，其中 46 个规则集，全部来自 Repcz/Tool 分支 X）：
#   - 第一条是 stun 拒绝，防 WebRTC 泄漏真实 IP；故意用 REJECT 而非 NO-DROP，理由见 README。
#   - 广告规则走 REJECT-NO-DROP，与 mihomo 的 REJECT-DROP 语义对齐。
#   - 国内、局域网、常见中国服务走 DIRECT/CN。
#   - 海外服务走 Proxy；未命中流量走 场景（在家直连 / 在外走 Proxy）。
#
# 模块（16 个，合计声明 31 个 MITM 域名）：
#   - 分组与排障顺序写在下方 modules 段；证书由 Egern 自己管理，ca_p12 / ca_passphrase 必须留空。

---
ipv6: false                                 # 关闭 IPv6 解析与出站，避免半开 IPv6 环境下大量连接超时
http_port: 3080                             # 本地 HTTP 代理端口，仅本机可用
socks_port: 3090                            # 本地 SOCKS5 代理端口，仅本机可用
allow_external_connections: false           # 不把代理开放给局域网其他设备；需要共享再改 true
vif_only: true                              # 只用 VIF（TUN）接管流量，不改系统代理设置
block_quic: true                            # 全局拦 UDP/443 让浏览器回落 TCP；要放行 HTTP/3 需连各策略组里的同名开关一起关
hide_vpn_icon: false                        # 是否在状态栏隐藏 VPN 图标
close_connections_on_policy_change: true    # 切策略时主动断开旧连接；否则长连接会继续走旧节点到自然断开，切完看不出效果
hijack_dns:
  - "*"                                     # 劫持全部 DNS 查询进内置解析器，防止应用自带 DNS 绕过
geoip_db_url: https://gh-proxy.com/https://github.com/xream/geoip/releases/latest/download/ipinfo.country.mmdb   # GEOIP 库：末条 geoip 兜底依赖它，下载失败会静默失效
asn_db_url: https://gh-proxy.com/https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb             # ASN 库：ChinaASN 规则专用，缺了这条规则不报错但不生效
proxy_latency_test_url: https://www.gstatic.com/generate_204                                        # 代理节点测速地址
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204                 # 直连测速地址（必须国内可达）
public_ip_lookup_url: https://ipv4.ddnspod.com                                                      # 出口 IP 查询：强制 IPv4（本配置 ipv6: false），且该域名国内可达，CN/DIRECT 策略下不会超时
compat_route: true                          # 兼容路由，缓解与其他 VPN/TUN 应用的路由冲突
include_all_networks: true                  # 主开关：打开后 APNs / 蜂窝服务 / 局域网三个附属开关才能生效（官方要求）；本项本身只接管默认网络流量
include_apns: true                          # 接管 APNs，蜂窝数据下推送才能命中 AppleServers 规则（依赖上面的主开关）
include_cellular_services: false            # 不接管 VoLTE/IMS，避免影响通话
include_local_networks: false               # 不接管局域网流量，配合 bypass_tunnel_proxy
vif_excluded_routes:                        # 路由级排除：这些网段压根不进 VIF 路由表，只接受 CIDR
  - "127.0.0.0/8"                           # 环回
  - "169.254.0.0/16"                        # 链路本地
  - "100.64.0.0/10"                         # CGNAT（Tailscale 等用这段）
  - "10.0.0.0/8"                            # 私有网段
  - "172.16.0.0/12"                         # 私有网段，Docker 的 172.17/172.18 也在这里
  - "192.168.0.0/16"                        # 私有网段，路由器 192.168.10.1 在这里
bypass_tunnel_proxy:                        # 目标级旁路：只放路由级表达不了的域名，CIDR 统一交给上面那段
  - "*.local"
  - "*.lan"
  - "localhost"
real_ip_domains:                            # 永远返回真实 IP、不走 Fake IP 的域名（局域网域名与时间同步）
  - "*.lan"
  - "*.local"
  - "time.*.apple.com"
  - "ntp.*.com"
  - "ntp.*.com.cn"
  - "*.push.apple.com"

dns:
  bootstrap:                                # 引导 DNS：只用来解析下面这些 DoH 的主机名，所以必须是 IP 形式
    - 223.5.5.5
    - 119.29.29.29
  upstreams:
    domestic:                               # 国内 DoH：命中国内规则的域名用它解析
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    overseas:                               # 国外 DoH：forward 判定为 overseas 的域名用它解析
      - https://8.8.8.8/dns-query
      - https://1.1.1.1/dns-query
  # 官方语义：proxy_nameservers 的连接一律强制直连（且绕过 forward 规则），
  # 因此必须填国内可达的 DoH；填 8.8.8.8 / 1.1.1.1 会在国内网络下解析失败，导致域名形式的节点全部不可用
  proxy_nameservers:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  forward:                                  # 自上而下匹配，决定用哪一组 upstream 解析（不写这条时全部走 overseas）
    - proxy_rule_set:
        match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Lan.yaml"
        value: domestic
        update_interval: 86400
    - proxy_rule_set:
        match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/ChinaDomain.yaml"
        value: domestic
        update_interval: 86400
    - domain_wildcard:                      # .cn 兜底走国内，避免 ChinaDomain 列表没收录的新域名被送去海外解析
        match: "*.cn"
        value: domestic
    - domain_wildcard:
        match: "*"
        value: overseas

policy_groups:
  # ── Subscription ──
  # 官方推荐写法：直接在 select 上写 urls（external 是等价的旧式写法，长期保留但不建议新配置使用）
  - select:
      name: 机场订阅
      urls: &SubURL                        # 锚点：Proxy 组用 *SubURL 复用同一份订阅，占位串只需改这一处
        - "这里填入你的机场订阅 URL"      # 占位串：必须替换成真实订阅地址，否则该组一直加载失败
      block_quic: true                  # 该组产出的节点同样拦 UDP/443
      hidden: true                      # 不在首页显示，只作订阅入口
      filter: &FilterAll '(?i)^(?!.*(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$'
      update_interval: 86400

  # ── 场景 ──
  # 连上透明代理路由器的 WiFi 时全直连（路由器已经翻墙），其他网络才交给 Proxy，避免双重代理。
  # WiFi1 / WiFi2 是占位名，必须换成路由器的真实 SSID；不确定就整组删掉、把 default 规则改回 policy: Proxy。
  # 注意：SSID 是精确匹配，公共热点如果正好叫 WiFi1 会被误判成直连，所以不要留着占位名不填。
  - conditional:
      name: 场景
      rules:
        - ssid:
            match: WiFi1
            policy: DIRECT
        - ssid:
            match: WiFi2
            policy: DIRECT
      default_policy: Proxy
      icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png"

  # ── Proxy ──
  # Auto 在前，后面直接跟全部订阅节点，便于手动挑单个节点。
  # 顺序由官方文档保证：urls 与 policies 混用时，订阅节点排在静态子策略之后并按名称去重。
  # 也就是说静态项（Auto、DIRECT、REJECT）只能排在节点「前面」，无法排到节点后面；
  # 为了让节点紧跟 Auto，这里只留 Auto，直连/拒绝改由 CN 组切换（那里仍是 DIRECT/Proxy/REJECT 三项）。
  # 没用 flatten：文档说 flatten 会展开「所有」嵌套策略组，Auto 会被一起展开、从列表里消失。
  # 代价是订阅会被拉取两次（机场订阅 一次、这里一次），间隔一致，不影响使用。
  - select:
      name: Proxy
      policies:
        - Auto
      urls: *SubURL                       # 与 机场订阅 共用锚点，不用改两处
      filter: *FilterAll
      block_quic: true
      update_interval: 86400
      icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png"

  - auto_test:
      name: Auto
      policies:
        - 机场订阅
      flatten: true                     # 把 机场订阅 的节点摊平后逐个测速
      block_quic: true
      hidden: false
      interval: 300                     # 每 300 秒测速一轮（与 mihomo 的 Auto 一致）
      tolerance: 50                     # 延迟优于当前节点 50ms 以上才切换，避免来回跳
      timeout: 5                        # 单次测速超时（秒）
      icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png"

  # ── CN ──
  - select:
      name: CN
      policies:
        - DIRECT
        - Proxy
        - REJECT
      icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png"

rules:
  # 全部来自 Repcz/Tool（分支 X）的 Egern 规则集，上游每日自动重建
  # ── 协议级 ──
  # 必须放第一条：STUN 不涉及域名/IP，放后面会被前面的 rule_set 抢走。
  # 这里用 REJECT 而不是 REJECT-NO-DROP：WebRTC 需要快速失败才能及时回落到 TURN，
  # 静默丢弃会让通话建立多等 5-10 秒。不拦 STUN 会把真实公网 IP 泄漏给网页。
  - protocol:
      name: stun
      match: stun
      policy: REJECT

  # ── REJECT ──
  # 用 REJECT-NO-DROP（丢弃不回 RST）与 mihomo 的 REJECT-DROP 语义对齐：
  # 回 RST 等于告诉广告 SDK“这里有拦截器”，会触发重试/切备用域名/上报特征。
  # 代价是拦截表现为超时，个别 App 首屏可能慢 1-3 秒；疑似误杀时先查这两条规则的命中日志。
  - rule_set:
      name: Reject
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Reject.yaml"
      policy: REJECT-NO-DROP
      update_interval: 86400
  - rule_set:
      name: Ads_AWAvenue
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Ads_AWAvenue.yaml"
      policy: REJECT-NO-DROP
      update_interval: 86400

  # ── DIRECT ──
  - rule_set:
      name: Lan
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Lan.yaml"
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: Direct
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Direct.yaml"
      policy: DIRECT
      update_interval: 86400

  # ── CN ──
  - rule_set:
      name: WeChat
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/WeChat.yaml"
      policy: CN
      update_interval: 86400
  - rule_set:
      name: Bilibili
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Bilibili.yaml"
      policy: CN
      update_interval: 86400
  # Apple 天气放行直连：AppleServers 里的 17.0.0.0/8 会把天气的 17.x CDN 一起拽去代理，
  # 天气数据 / WeatherKit 已在 AppleCN 里，这里补上 AppleCN 没覆盖的两个
  - domain_suffix:
      match: weather.apple.com
      policy: CN
  - domain_suffix:
      match: weather-analytics-events.apple.com
      policy: CN
  - rule_set:
      name: AppleCN
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/AppleCN.yaml"
      policy: CN
      update_interval: 86400
  - rule_set:
      name: OneDrive
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/OneDrive.yaml"
      policy: CN
      update_interval: 86400
  - rule_set:
      name: DownloadCDN_CN
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/DownloadCDN_CN.yaml"
      policy: CN
      update_interval: 86400
  - rule_set:
      name: ChinaDomain
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/ChinaDomain.yaml"
      policy: CN
      update_interval: 86400
  - rule_set:
      name: ChinaASN                    # 依赖上面 asn_db_url 的 ASN 库，库拉不下来时这条规则静默不生效
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/ChinaASN.yaml"
      policy: CN
      update_interval: 86400
  - rule_set:
      name: ChinaIP
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/ChinaIP.yaml"
      policy: CN
      update_interval: 86400

  # ── Proxy ──
  - rule_set:
      name: AI
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/AI.yaml"
      policy: Proxy
      update_interval: 86400
  - rule_set:
      name: OpenAI
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/OpenAI.yaml"
      policy: Proxy
      update_interval: 86400
  - rule_set:
      name: Telegram
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Telegram.yaml"
      policy: Proxy
      update_interval: 86400
  - rule_set:
      name: Twitter
      match: "https://gh-proxy.com/https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Twitter.yaml"
